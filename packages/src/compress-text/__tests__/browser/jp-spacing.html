<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>日文留白 · Yugioh Card</title>
    <link rel="icon" href="/docs/public/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/test-pages/style.css">
  </head>
  <body class="test-site" data-test-page="jp-spacing" data-test-state="running">
    <header class="test-nav">
      <div class="test-shell"><a href="/test-pages/">← 全部测试</a></div>
    </header>
    <main class="test-shell test-main">
      <header class="test-heading">
        <h1>日文留白</h1>
        <p class="test-description">用实际日文字体对比原始字距与旧版字距。</p>
      </header>
      <div class="test-layout">
        <p id="status" class="test-status" role="status">正在检查字体加载和排版…</p>
        <section class="test-panel">
          <label for="input"><strong>对照文本</strong></label>
          <div id="spacing-controls"></div>
        </section>
        <div class="test-compare">
          <section class="test-panel">
            <h2>字体原始留白</h2>
            <div class="test-stage"><div id="original"></div></div>
          </section>
          <section class="test-panel">
            <h2>旧版字距</h2>
            <div class="test-stage"><div id="trimmed"></div></div>
          </section>
        </div>
        <div class="test-compare">
          <section class="test-panel">
            <h2>OCG 日文卡片</h2>
            <div class="test-stage"><div id="ocg" class="test-card"></div></div>
          </section>
          <section class="test-panel">
            <h2>第二期日文卡片</h2>
            <div class="test-stage"><div id="series2" class="test-card"></div></div>
          </section>
        </div>
        <section class="test-panel">
          <h2>检查结果</h2>
          <pre id="report" class="test-report"></pre>
        </section>
      </div>
    </main>
<script type="module">
import { ElButton, ElInput } from 'element-plus';
import 'element-plus/es/components/button/style/css';
import 'element-plus/es/components/input/style/css';
import { createApp, h, ref } from 'vue';

const mode = new URLSearchParams(location.search).has('package') ? 'package' : 'source';
const results = [], temporary = [], views = [], cards = [], unhandled = [];
const status = document.querySelector('#status');
const report = document.querySelector('#report');
const samples = [];
const samplesReady = ref(false);
const comparisonText = ref('[青眼(ブルーアイズ)]の[白龍(ホワイト・ドラゴン)] コーヒー スーパー 々〆゛゜ゝゞー ０１２３４５６７８９ AV。');
const updateComparison = () => {
  comparisonText.value = document.querySelector('#input').value;
  for (const text of samples) text.set({ text: comparisonText.value });
};

createApp({
  render: () => [
    h(ElInput, {
      id: 'input',
      class: 'test-input',
      type: 'textarea',
      rows: 3,
      resize: 'vertical',
      modelValue: comparisonText.value,
      'onUpdate:modelValue': value => { comparisonText.value = value; },
    }),
    h(ElButton, {
      id: 'update',
      type: 'primary',
      disabled: !samplesReady.value,
      onClick: updateComparison,
    }, () => '更新对照'),
  ],
}).mount('#spacing-controls');

const check = (condition, label) => {
  results.push(`${condition ? 'PASS' : 'FAIL'} ${label}`);
  report.textContent = results.join('\n');
  if (!condition) throw new Error(label);
};
const equal = (a, b) => Math.abs(a - b) < 1e-7;
window.addEventListener('unhandledrejection', event => unhandled.push(String(event.reason)));
try {
  await fetch('/jp-test-reset', { method: 'POST' });
  const entry = mode === 'package' ? '/node_modules/.cache/jp-package-consumer/browser.mjs' : './jp-spacing-runtime.js';
  const { Leafer, CompressText, YugiohCard, YugiohSeries2Card, getBrowserFontResource, getFontInfo } = await import(/* @vite-ignore */ entry);
  const resourcePath = '/jp-resources';
  const data = {
    language: 'jp', renderScale: 0.2, name: '[青眼の白龍(ブルーアイズ・ホワイト・ドラゴン)]',
    monsterTypeLine: 'ドラゴン族／通常', cardText: '[高(たか)]い[攻撃力(こうげきりょく)]を[誇(ほこ)]るドラゴン。\nコーヒーとスーパー、０１２３４５６７８９。',
    artwork: '/src/assets/image/blue-eyes.jpg',
  };
  for (const [Card, id] of [[YugiohCard, 'ocg'], [YugiohSeries2Card, 'series2']]) {
    cards.push(new Card({ resourcePath, view: document.querySelector(`#${id}`), data }));
  }
  const make = (content, sideBearingMode = 'legacy', extra = {}) => {
    const text = new CompressText({ text: content, fontFamily: 'ygo-jp', fontSize: 38, width: 1000, textAlign: 'left', sideBearingMode, ...extra });
    temporary.push(text); return text;
  };
  const before = make('日あー');
  check(before.bounds.width > 0 && before.rubyList.every(ruby => !ruby.bodyRun), '字体未加载时 fallback 预览可见，尚未裁减留白');
  const resource = getBrowserFontResource(`${resourcePath}/yugioh/font`);
  while (!resource.fonts.has('ygo-jp')) await new Promise(requestAnimationFrame);
  check(resource.fonts.get('ygo-jp').status === 'loading' && cards.every(card => card._readiness.pending), '字体请求受控等待时 ready 保持 pending');
  await fetch('/jp-test-release', { method: 'POST' });
  await resource.promise;
  await Promise.all(cards.map(card => card.ready));
  check(before.rubyList.some(ruby => ruby.bodyRun), '独立 CompressText 在二进制字体注册完成后自动重排');
  const font = getFontInfo(resource.fonts.get('ygo-jp'));
  check(font.unitsPerEm === 1024 && font.hasGlyphForCodePoint(0x65E5), '从实际 WOFF2 动态读取字体单位和字符覆盖');
  check(equal(make('日').bounds.width, 834 * 38 / 1024), '日：占宽为 834/1024 em');
  check(equal(make('あ').bounds.width, 861 * 38 / 1024), 'あ：占宽为 861/1024 em');
  check(equal(make('三').bounds.width, 1027 * 38 / 1024)
    && equal(make('ー').bounds.width, 907 * 38 / 1024), '旧版度量恢复汉字补白，长音符按文档参与缩减');
  check(equal(make('０').bounds.width, 702 * 38 / 1024), '全角数字保留供体 702 占宽');
  check(equal(make('日', 'native').bounds.width, 38), '原生模式保留字体原始占宽');
  for (const content of ['コーヒー', 'スーパー', 'ーー', '々〆゛゜ゝゞ']) {
    const text = make(content);
    check(text.bounds.width < make(content, 'native').bounds.width && text.rubyList.some(ruby => ruby.bodyRun), `假名及额外字符参与缩减：${content}`);
  }
  for (const content of ['０１２３', 'ＡＢＣ', 'AV', 'ΩЖ', '。、「」【】（）！？・', '𠮷']) {
    const text = make(content);
    check(equal(text.bounds.width, make(content, 'native').bounds.width) && text.rubyList.every(ruby => !ruby.bodyRun), `原生度量保留：${content}`);
  }
  check(make('日日', 'legacy', { width: 65 }).currentLine === 0 && make('日日', 'native', { width: 65 }).currentLine === 1, '换行依据调整后的逻辑占宽');
  const tg = make('「[TG(テックジーナス)]」').flatItemList.find(item => item.rt.text);
  check(equal(tg.rt.rtNode.scaleX, 0.6) && tg.ruby.paddingLeft > 0 && tg.ruby.paddingLeft < 5
    && equal(tg.ruby.width + tg.ruby.paddingLeft + tg.ruby.paddingRight, tg.rt.width * 0.6), 'TG 注音压到 60% 后再为正文补白');
  const reading = 'テックジーナス';
  const longTgText = make(`の「[TG(${reading.repeat(3)})]」モンスター`);
  const longTgIndex = longTgText.flatItemList.findIndex(item => item.rt.text);
  const longTg = longTgText.flatItemList[longTgIndex];
  const previous = longTgText.flatItemList[longTgIndex - 1].ruby;
  const following = longTgText.flatItemList[longTgIndex + 1].ruby;
  const longTgBounds = longTg.rt.rtNode.getBounds('content', 'local');
  check(equal(longTg.rt.rtNode.scaleX, 0.6) && longTg.ruby.paddingLeft > 5
    && equal(longTgBounds.x, previous.rubyNode.x + previous.width)
    && equal(longTgBounds.x + longTgBounds.width, following.rubyNode.x), '超长 TG 注音按实际占宽补白，与相邻文字分开');
  const overLine = make(`「[TG(${reading.repeat(28)})]」`, 'legacy', { width: 600 });
  const overLineRt = overLine.flatItemList.find(item => item.rt.text).rt;
  const overLineBounds = overLineRt.rtNode.getBounds('content', 'local');
  check(overLineRt.rtNode.scaleX < 0.6 && equal(overLine.bounds.width, 600)
    && overLineBounds.x > 0 && overLineBounds.x + overLineBounds.width < 600, '超过一行的注音与引号共同适配行宽');
  const cluster = make('葛\u{E0100}か\u3099A\u0301', 'legacy', { width: 1 });
  check(cluster.rubyList.every(ruby => !ruby.bodyRun) && cluster.rubyList.map(ruby => ruby.text).join('') === '葛\u{E0100}か\u3099A\u0301', '字素簇与 IVS 保留完整');
  const small = make('[日あー(X)]\n[日あー(X)]', 'legacy', { height: 30, autoSmallSize: true, smallFontSize: 10, lineHeight: 1.1, letterSpacing: 2 });
  check(small.isSmallSize && small.rubyList.filter(ruby => ruby.bodyRun).every(ruby => equal(ruby.width, ruby.bodyRun.width * ruby.rubyNode.scaleX)), '小字回退同时更新逻辑宽度和内部绘制位置');
  const other = make('日', 'legacy', { fontFamily: 'ygo-sc' });
  check(getFontInfo(resource.fonts.get('ygo-sc')).unitsPerEm === 1000 && other.rubyList[0].bodyRun && other.bounds.width < make('日', 'native', { fontFamily: 'ygo-sc' }).bounds.width, '另一字体、1000 单位字框同样可用，无固定字体配置');
  for (const [host, sideBearingMode] of [['original', 'native'], ['trimmed', 'legacy']]) {
    const view = new Leafer({ view: document.querySelector(`#${host}`), width: 620, height: 220 }); views.push(view);
    const text = new CompressText({ text: document.querySelector('#input').value, fontFamily: 'ygo-jp', fontSize: 32, rtFontSize: 13, rtOffsetY: -8, width: 596, height: 190, x: 12, y: 22, textAlign: 'left', sideBearingMode });
    view.add(text); samples.push(text);
  }
  samplesReady.value = true;
  const mixed = make('[日AV。　あ(X)]', 'legacy', { gradient: true, letterSpacing: 2 });
  const nodes = mixed.rubyList[0].rubyNode.children;
  check(nodes.map(node => node.text).join('|') === '日|AV。　|あ' && nodes.every(node => node.fill.type === 'linear'), '混合文字保留西文段、全角空格和渐变');
  check(equal(nodes[0].x + nodes[0].fill.from.x, nodes[1].x + nodes[1].fill.from.x), '子字形使用共同的渐变坐标');
  const exports = [];
  for (const card of cards) {
    const sideBearingMode = card instanceof YugiohCard ? 'legacy' : 'native';
    const name = make(data.name, sideBearingMode, { fontSize: card.nameNode.fontSize });
    const effect = make('高', sideBearingMode, { fontSize: card.cardTextNode.fontSize });
    check(card.nameNode.rubyList.length === name.rubyList.length
      && card.nameNode.rubyList.every((ruby, index) => equal(ruby.normalWidth, name.rubyList[index].normalWidth))
      && equal(card.cardTextNode.rubyList[0].normalWidth, effect.rubyList[0].normalWidth), `${card.tag} 日文卡名和效果正文使用 ${sideBearingMode} 字距`);
    const { ruby, rt } = card.nameNode.flatItemList[0];
    const spacing = (ruby.width * 0.9 - rt.width) / (rt.text.length - 1);
    check(spacing > 0 && equal(rt.rtNode.letterSpacing, spacing) && rt.rtNode.scaleX === 1
      && equal(rt.rtNode.x, ruby.rubyNode.x + (ruby.width + spacing) / 2), `${card.tag} 卡名的短注音按正文占宽展开字距并居中`);
    const png = (await card.leafer.export('png', { screenshot: true })).data;
    check(png.startsWith('data:image/png;base64,') && png.length > 10000, `${card.tag} 实际 PNG 导出成功`);
    exports.push(png.length);
  }
  cards[0].setData({ language: 'en', name: 'Normal English', cardText: 'Normal English' });
  await cards[0].ready;
  check(cards[0].nameNode.rubyList.every(ruby => !ruby.bodyRun), '切换英文后恢复原生路径');
  cards[0].setData({ ...data, cardLayout: 'pendulum', pendulumEffect: 'コーヒー 日あー' });
  await cards[0].ready;
  check(cards[0].pendulumEffectNode.rubyList.some(ruby => ruby.bodyRun), '切回日文并切换灵摆时正确更新留白');
  cards[1].setData({ cardLayout: 'monster', atk: 3000, def: 2500 });
  await cards[1].ready;
  check(cards[1].battleStatsNode.children.every(text => text.rubyList.every(ruby => !ruby.bodyRun)), '第二期攻守文字使用原生字距');
  check(unhandled.length === 0, '没有未处理 Promise 拒绝');
  status.classList.add('pass'); status.textContent = `${mode === 'package' ? '发布包' : '源码'}：全部 ${results.length} 项检查通过`;
  await fetch(`/jp-test-report?mode=${mode}`, { method: 'POST', body: JSON.stringify({ ok: true, checks: results.length, results, exports, userAgent: navigator.userAgent }) });
  document.body.dataset.testState = 'passed';
} catch (error) {
  await fetch('/jp-test-release', { method: 'POST' });
  status.classList.add('fail'); status.textContent = `${mode}：${error.message}`;
  report.textContent += `\n${error.stack}`;
  await fetch(`/jp-test-report?mode=${mode}`, { method: 'POST', body: JSON.stringify({ ok: false, results, error: error.stack, unhandled }) });
  document.body.dataset.testState = 'failed';
} finally {
  temporary.forEach(text => text.destroy());
}
window.addEventListener('pagehide', () => { cards.forEach(card => card.leafer.destroy(true)); views.forEach(view => view.destroy(true)); });
</script>
  </body>
</html>
