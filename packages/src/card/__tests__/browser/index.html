<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>Card ready 浏览器验证</title>
<style>
body { font: 16px system-ui; background:#17212f; color:#e5eefb; margin:24px; }
h1 {font-size:24px} button {font:inherit;padding:10px 16px;cursor:pointer} .cards{display:flex;gap:20px;margin:20px 0} .card{width:279px} pre{white-space:pre-wrap;background:#0c1420;padding:16px;max-width:1000px} #export{width:220px} .pass{color:#80e7a1}
</style>
<h1>统一 card.ready · Edge 验证</h1>
<p>字体清单暂未返回：预览使用 fallback 字体。两个卡片共用加载任务。</p>
<button id="start">释放资源并验证</button>
<div class="cards"><div id="a" class="card"></div><div id="b" class="card"></div></div>
<pre id="report">初始化中</pre><img id="export" alt="等待导出">
<script type="module">
import { FieldCenterCard, YugiohCard } from '/packages/index.ts';
import { CompressText } from '/packages/src/compress-text/compress-text.ts';
import { Leafer } from 'leafer-unified';
const report = document.querySelector('#report');
const results = [];
const failures = [];
window.addEventListener('unhandledrejection', event => { failures.push(String(event.reason)); });
const check = (condition, label) => {
  results.push(`${condition ? 'PASS' : 'FAIL'} ${label}`);
  report.textContent = results.join('\n');
  if (!condition) throw new Error(label);
};
// 控制请求使用另一个主机名，避免被故意挂起的资源占满同源连接。
const controlOrigin = `${location.protocol}//${location.hostname === 'localhost' ? '127.0.0.1' : 'localhost'}:${location.port}`;
const release = name => fetch(`${controlOrigin}/ready-test/release/${name}`, { method: 'POST' });
await fetch(`${controlOrigin}/ready-test/reset`, { method: 'POST' });
const waitFor = async predicate => {
  const deadline = performance.now() + 20000;
  while (!predicate()) {
    if (performance.now() > deadline) throw new Error('Browser assertion timed out');
    await new Promise(requestAnimationFrame);
  }
};
class ObservedCard extends YugiohCard {
  draw() { this.drawCount = (this.drawCount || 0) + 1; super.draw(); }
}
const options = {
  resourcePath: '/ready-resources',
  readyTimeout: 120000,
  data: { name: 'Blue-Eyes White Dragon', language: 'en', monsterTypeLine: 'Beast-Warrior / Pendulum / Tuner / Effect', cardText: 'A visible fallback preview while fonts and images are loading.', artwork: '/ready-resources/photo.jpg', cardNumber: 'READY-EN001', password: '89631139', renderScale: 0.2 },
};
const a = new ObservedCard({ ...options, view: 'a' });
const b = new ObservedCard({ ...options, view: 'b' });
class FailedMaskCard extends FieldCenterCard {
  drawArtworkMask() { super.drawArtworkMask(); this.artworkMaskNode.url = '/ready-resources/missing-mask.png'; }
}
const fontProbe = new ObservedCard({ ...options, data: { ...options.data, artwork: '/ready-resources/retry.jpg' } });
const imageProbe = new FailedMaskCard({ ...options, data: { renderScale: 0.1, artwork: '/ready-resources/photo.jpg' } });
let fontProbeError, imageProbeError;
fontProbe.ready.catch(error => { fontProbeError = error; });
imageProbe.ready.catch(error => { imageProbeError = error; });
let state = 'pending';
a.ready.then(() => { state = 'ready'; }, error => { state = error.code; });
const initial = { name: a.nameNode.bounds.width, race: a.monsterTypeLineNode.lastSegmentScaleX, packageX: a.cardNumberNode.x };
window.readyTest = { a, b, initial, results, failures };
await new Promise(requestAnimationFrame);
check(state === 'pending' && a.nameNode.rubyList.length > 0 && initial.name > 0, '字体清单返回前有可用 fallback 文字，ready 保持 pending');
document.querySelector('#start').onclick = async event => {
  event.target.disabled = true;
  try {
    try {
      await waitFor(() => fontProbeError && imageProbeError);
      check(fontProbeError.code === 'RESOURCE_FAILED' && fontProbeError.resource.endsWith('/retry.jpg') && fontProbeError.cause && a._readiness.fonts.status !== 'loaded', '字体清单仍在等待时，已知图片失败立即保留资源和原因返回');
      check(imageProbeError.code === 'RESOURCE_FAILED' && imageProbeError.resource.endsWith('/missing-mask.png') && imageProbeError.cause && imageProbe._readiness.images.records.get('/ready-resources/photo.jpg').status === 'loading', '前面的图片仍在加载时，后面的图片失败立即返回');
    } finally {
      fontProbe.leafer.destroy(true);
      imageProbe.leafer.destroy(true);
    }
    await release('manifest');
    await waitFor(() => a._readiness.fonts.fonts.size > 0);
    check(state === 'pending', '字体清单已返回、字体字节仍在等待时不提前完成');
    await release('fonts');
    await waitFor(() => a.drawCount === 2 && b.drawCount === 2);
    check(state === 'pending', '字体最终排版完成，仍等待卡图');
    check(a.nameNode.bounds.width !== initial.name && a.cardNumberNode.x !== initial.packageX, '相同文字参数使用真实字体重测量，并更新依赖位置');
    check(a._readiness.fonts.fonts.get('ygo-kr').status === 'idle', '英文卡片未加载韩文字体');
    await release('photo');
    await Promise.all([a.ready, b.ready]);
    check(state === 'ready' && a.leafer.imageReady && b.leafer.imageReady, '两张卡片的资源、排版和实际渲染全部完成');
    const counts = await (await fetch(`${controlOrigin}/ready-test/counts`)).json();
    window.readyTest.coldFontFiles = Object.keys(counts).filter(file => file.endsWith('.woff2'));
    check(counts['yugioh/font/font-list.json'] === 1 && counts['yugioh/font/ygo-en-italic.woff2'] === 1 && window.readyTest.coldFontFiles.every(file => counts[file] === 1), '并发卡片共用真实字体请求');
    check(!counts['yugioh/font/ygo-kr.woff2'] && !counts['yugioh/font/ygo-jp.woff2'] && !counts['yugioh/font/ygo-sc.woff2'], '英文首屏只请求当前卡片使用的字体');
    const old = a.ready, draws = a.drawCount;
    a.setData({ name: 'Cached synchronous update' });
    check(a.nameNode.text === 'Cached synchronous update' && a.drawCount === draws + 1 && a.ready !== old, '缓存后的 setData 同步更新节点并建立新 Promise');
    await a.ready;
    check(a.drawCount === draws + 1, '缓存更新没有额外完整排版');
    for (const [label, data] of [['空对象', {}], ['完全相同的数据', { ...a.data }]]) {
      const previous = a.ready;
      a.setData(data);
      check(a.ready !== previous, `${label}更新建立新 Promise`);
      await a.ready;
      check(a.leafer.imageReady, `${label}更新在真实引擎中正常完成`);
    }
    let partial, constructionError;
    class InvalidCard extends ObservedCard {
      initLeafer() { super.initLeafer(); partial = this; }
    }
    try {
      new InvalidCard({ ...options, data: { ...options.data, language: 'unsupported-language' } });
    } catch (error) { constructionError = error; }
    try {
      check(constructionError && partial?._readiness.disposed && partial.leafer.destroyed && !partial.leafer.children?.length, '构造失败后自动清理协调器、节点和画布');
      try { await partial.ready; check(false, '构造失败应拒绝 ready'); }
      catch (error) { check(error === constructionError, '构造失败保留原始异常'); }
    } finally { partial?.leafer.destroy(true); }
    const view = a.leafer;
    let updateError;
    try { a.setData({ language: 'unsupported-language' }); }
    catch (error) { updateError = error; }
    try { await a.ready; check(false, '更新失败应拒绝 ready'); }
    catch (error) { check(error === updateError && !a._readiness.disposed && !view.destroyed, '后续更新失败保留实例和原始异常'); }
    a.setData({ language: 'en' });
    await a.ready;
    check(a.leafer === view && a.nameNode.text === 'Cached synchronous update', '修正数据后原实例可以继续使用');
    a.setData({ artwork: '/ready-resources/retry.jpg' });
    try { await a.ready; check(false, '必需图片失败应拒绝'); }
    catch (error) { check(error.code === 'RESOURCE_FAILED' && error.resourceType === 'image', '必需图片失败严格拒绝 ready'); }
    a.setData({ artwork: '' });
    await a.ready;
    check(!a.artworkStatusNode.visible, '移除失败的卡图后不残留错误占位');
    await release('retry');
    a.setData({ artwork: '/ready-resources/retry.jpg' });
    await a.ready;
    check(!a.artworkStatusNode.visible, '同一图片地址重试成功，错误占位已清除');
    for (const data of [{ language: 'kr' }, {}]) {
      a.setData(data);
      const error = await a.ready.then(() => null, error => error);
      check(error?.resourceType === 'font' && error.resource.endsWith('/ygo-kr.woff2') && error.cause, '切换到需要韩文字体时报告加载失败及其原因');
    }
    const afterRetry = await (await fetch(`${controlOrigin}/ready-test/counts`)).json();
    check(afterRetry['yugioh/font/ygo-kr.woff2'] === 2, '显式更新只重试必需的失败字体');
    a.setData({ language: 'jp', cardLayout: 'spell', name: '[青眼(ブルーアイズ)]', cardText: '[魔法(まほう)]カードのテスト。', spellTrapIcon: 'continuous' });
    await a.ready;
    check(a.spellTrapLabelNode.visible && a.nameNode.rubyList.length > 0, '切换语言、注音和魔陷布局后等待最终画面');
    const afterSwitch = await (await fetch(`${controlOrigin}/ready-test/counts`)).json();
    check(afterSwitch['yugioh/font/ygo-jp.woff2'] === 1 && b.leafer.imageReady, '切换到日文时按需加载，英文卡片保持可用');
    for (const [label, data, family, part] of [
      ['正文大小写', { text: 'WWWWWWiiiiii', fontFamily: 'READY-Body' }, 'ready-body', 'ruby'],
      ['注音大小写', { text: '[A(WWWWWWiiiiii)]', fontFamily: 'serif', rtFontFamily: 'READY-Ruby' }, 'ready-ruby', 'rt'],
      ['带引号备用字体', { text: 'WWWWWWiiiiii', fontFamily: '\"Missing Font\", \"READY-Fallback\", serif' }, 'ready-fallback', 'ruby'],
    ]) {
      const standaloneView = new Leafer({ width: 250, height: 80 });
      const text = new CompressText({ ...data, width: 240, fontSize: 30, rtFontSize: 20, textAlign: 'left' });
      standaloneView.add(text);
      try {
        await document.fonts.ready;
        await new Promise(requestAnimationFrame);
        const measured = () => text.flatItemList[0][part].originalWidth;
        const before = measured();
        let layouts = 0;
        const compress = text.compressText.bind(text);
        text.compressText = () => { layouts++; compress(); };
        const unrelated = new FontFace(`${family}-unrelated`, 'url(/ready-resources/yugioh/font/ygo-en-race.woff2)');
        document.fonts.add(unrelated);
        await unrelated.load();
        await document.fonts.ready;
        await new Promise(requestAnimationFrame);
        check(layouts === 0, `${label}：无关字体加载不触发重排`);
        const face = new FontFace(family, 'url(/ready-resources/yugioh/font/ygo-en-race.woff2)');
        document.fonts.add(face);
        await face.load();
        await waitFor(() => measured() !== before);
        check(layouts === 1 && measured() !== before, `${label}：初次 fonts.ready 后加载真实字体仍会正确重排`);
      } finally { standaloneView.destroy(true); }
    }
    const doomed = new ObservedCard({ ...options, data: { ...options.data, artwork: '/ready-resources/destroy.jpg' } });
    const promise = doomed.ready;
    doomed.leafer.destroy(true);
    try { await promise; check(false, '销毁应拒绝'); }
    catch (error) { check(error.code === 'CARD_DESTROYED', '销毁会拒绝 pending 的 ready'); }
    const exported = await a.leafer.export('png', { screenshot: true });
    check(exported.data.startsWith('data:image/png;base64,'), 'ready 后真实 PNG 导出成功');
    document.querySelector('#export').src = exported.data;
    check(failures.length === 0, '没有未处理的 Promise rejection');
    report.className = 'pass';
    document.querySelector('p').textContent = '验证完成：fallback 预览、共享资源、最终排版、失败重试及导出均通过。';
    window.readyTest.complete = true;
  } catch (error) {
    results.push(error.stack);
    report.textContent = results.join('\n');
    window.readyTest.error = String(error);
  }
};
</script>
</html>
