<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>排版等价与批量导出验证</title>
<style>body{font:16px system-ui;margin:24px;color:#234}#status{font-size:20px}.pass{color:#167044}.fail{color:#a22}#host{width:1400px;height:650px}pre{white-space:pre-wrap}</style>
<h1>排版等价与批量导出验证</h1><p id="status">正在加载测试运行时…</p><pre id="summary"></pre><div id="host"></div>
<script type="module">
import { textCases, updateCases, batchData, classData, textOptionsFor, textSnapshot, nodeSnapshot } from './layout-cases.js';
import { textCases as breakingCases } from './breaking-cases.js';
const mode = new URLSearchParams(location.search).get('mode') || 'source';
const run = new URLSearchParams(location.search).get('run');
const baselineRoots = {
  breaking: '/node_modules/.cache/text-breaking/baseline-dd15fac',
  refactor: '/node_modules/.cache/text-refactor/baseline-d7f362f',
};
const checksBreakingCases = run === 'breaking' || run === 'refactor';
const cases = checksBreakingCases ? breakingCases : textCases;
const runQuery = checksBreakingCases ? `&run=${run}` : '';
const debugImages = new URLSearchParams(location.search).has('images');
const output = { text: [], updates: [], batch: [], classes: [] };
const status = document.querySelector('#status');
const summary = document.querySelector('#summary');
const host = document.querySelector('#host');
const unhandled = [];
window.addEventListener('unhandledrejection', event => unhandled.push(String(event.reason)));
const progress = text => { status.textContent = `${mode}：${text}`; };
const digest = async data => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', data))).map(byte => byte.toString(16).padStart(2, '0')).join('');
const pixels = async (view, label) => {
  // 固定 CPU 2D 导出与像素倍率，减少图片缩放后端对像素对照的干扰。
  const result = await view.export('png', { screenshot: true, pixelRatio: devicePixelRatio, contextSettings: { willReadFrequently: true } });
  if (debugImages && label) await fetch(`/layout-image?mode=${mode}&label=${label}${runQuery}`, { method: 'POST', body: result.data });
  const image = new window.Image(); image.src = result.data; await image.decode();
  const canvas = document.createElement('canvas'); canvas.width = image.width; canvas.height = image.height;
  const context = canvas.getContext('2d', { willReadFrequently: true }); context.drawImage(image, 0, 0);
  const rgba = await digest(context.getImageData(0, 0, image.width, image.height).data);
  canvas.width = canvas.height = 0;
  return { width: image.width, height: image.height, rgba };
};
try {
  const baselineRoot = checksBreakingCases ? baselineRoots[run] : '/node_modules/.cache/layout-perf/baseline-3cc42eb';
  const packageCache = run === 'refactor' ? 'text-refactor' : 'layout-perf';
  const runtime = mode.startsWith('baseline') ? `${baselineRoot}/runtime.js`
    : mode === 'package' ? `/node_modules/.cache/${packageCache}/package-consumer/runtime.js` : './browser-runtime.js';
  // 缓存目录中的 runtime 本身也受 node_modules 的 immutable HTTP 缓存影响。
  const api = await import(/* @vite-ignore */ `${runtime}?t=${Date.now()}`);
  const { Leafer, CompressText, getBrowserFontResource } = api;
  const createText = options => new CompressText(textOptionsFor(CompressText, options));
  await getBrowserFontResource('/src/assets/yugioh-card/yugioh/font').promise;
  const capture = async (text, view) => ({ layout: textSnapshot(text), pixels: await pixels(view) });
  for (const [index, data] of cases.entries()) {
    progress(`文本 ${index + 1}/${cases.length}`);
    const view = new Leafer({ view: host, width: 1400, height: 650 });
    const text = createText({ fontFamily: 'ygo-jp', fontSize: 38, rtFontSize: 13, rtOffsetY: -6, width: 1175, sideBearingRatio: 0.5, ...data });
    view.add(text);
    try { output.text.push(await capture(text, view)); }
    finally { view.destroy(true); }
  }
  if (checksBreakingCases && !mode.startsWith('baseline')) {
    const visible = result => result.layout.items.map(item => item.ruby.text).filter(text => text !== '\n').join('');
    if (!visible(output.text[99]).includes('__RB0__')) throw new Error('原文占位符发生碰撞');
    if (!visible(output.text[100]).includes('\u200B')) throw new Error('原文零宽空格丢失');
    for (const index of [109, 110]) if (visible(output.text[index]) !== '甲乙' || output.text[index].layout.currentLine !== 1) throw new Error('硬换行未正确解析');
    for (const index of [106, 107, 108]) {
      const first = output.text[index].layout.items[0].ruby;
      if (first.text.includes('[') || !output.text[index].layout.items.some(item => item.rt.text || index === 108)) throw new Error('ruby 解析失败');
    }
  }
  for (const extra of [{}, { gradient: true }, { strokeWidth: 1, rtStrokeWidth: 1 }, { sideBearingRatio: 1 }, { height: 35, autoSmallSize: true, smallFontSize: 12 }]) {
    const view = new Leafer({ view: host, width: 1400, height: 650 });
    const text = createText({ text: '[日あー(X)] AV。\n日  日', fontFamily: 'ygo-jp', fontSize: 38, width: 400, sideBearingRatio: 0.5, ...extra });
    view.add(text);
    try {
      const steps = [await capture(text, view)];
      for (const update of updateCases) {
        progress(`更新序列 ${output.updates.length + 1}/5，步骤 ${steps.length}/${updateCases.length}`);
        text.set(textOptionsFor(CompressText, update)); steps.push(await capture(text, view));
      }
      output.updates.push(steps);
    } finally { view.destroy(true); }
  }
  const images = [0, 1, 2].map(index => `/node_modules/.cache/layout-perf/browser-images/${index}.png`);
  const card = new api.YugiohCard({ view: host, resourcePath: '/src/assets/yugioh-card', data: { scale: 1 } });
  const defaults = structuredClone(card.data);
  try {
    for (let index = 0; index < 100; index++) {
      progress(`批量 ${index + 1}/100`);
      const data = batchData(defaults, index, images); card.setData(data); await card.ready;
      output.batch.push({ name: data.name, pixels: await pixels(card.leafer, index < 4 ? `batch-${index}` : null), nodes: JSON.parse(JSON.stringify(nodeSnapshot(card.leafer))) });
    }
  } finally { card.leafer.destroy(true); }
  for (const name of ['YugiohCard', 'YugiohSeries2Card', 'RushDuelCard', 'FieldCenterCard', 'YugiohBackCard']) {
    progress(`卡片类 ${name}`);
    const card = new api[name]({ view: host, resourcePath: '/src/assets/yugioh-card', data: { scale: 0.15 } });
    const defaults = structuredClone(card.data), samples = [], layouts = [];
    try {
      for (let index = 0; index < 4; index++) { card.setData(classData(name, defaults, index, images)); await card.ready; samples.push(await pixels(card.leafer, `${name}-${index}`)); layouts.push(JSON.parse(JSON.stringify(nodeSnapshot(card.leafer)))); }
      if (JSON.stringify(samples[0]) !== JSON.stringify(samples[3]) || JSON.stringify(layouts[0]) !== JSON.stringify(layouts[3])) throw new Error(`${name}: A → B → A 未恢复原输出`);
      output.classes.push({ name, samples, layouts });
    } finally { card.leafer.destroy(true); }
  }
  if (unhandled.length) throw new Error(unhandled.join('\n'));
  const response = await fetch(`/layout-report?mode=${mode}${runQuery}`, { method: 'POST', body: JSON.stringify(output) });
  const result = await response.json();
  if (!result.ok) throw new Error(result.error);
  status.className = 'pass'; status.textContent = `${mode}：全部验证通过`;
  summary.textContent = JSON.stringify(result, null, 2);
} catch (error) {
  status.className = 'fail'; status.textContent = `${mode}：${error.message}`;
  summary.textContent = error.stack;
  await fetch(`/layout-error?mode=${mode}${runQuery}`, { method: 'POST', body: JSON.stringify({ error: error.stack, unhandled }) });
}
</script>
</html>
