<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>导出取消 · Yugioh Card</title>
    <link rel="icon" href="/docs/public/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/test-pages/style.css">
  </head>
  <body class="test-site" data-test-page="export-cancel" data-test-state="loading">
    <header class="test-nav">
      <div class="test-shell"><a href="/test-pages/">← 全部测试</a></div>
    </header>
    <main class="test-shell test-main">
      <header class="test-heading">
        <h1>导出取消</h1>
        <p class="test-description">字体清单等待期间点击「导出 PNG」，切换卡片类型或卸载组件，再释放清单并查看错误提示计数。</p>
      </header>
      <div class="test-layout">
        <section id="controls" class="test-panel test-layout" aria-label="测试控制">
          <output id="report" class="test-status" role="status">正在挂载组件…</output>
          <div id="export-actions" class="test-actions"></div>
        </section>
        <div id="app"></div>
      </div>
    </main>
<script type="module">
import { ElButton } from 'element-plus';
import 'element-plus/es/components/button/style/css';
import { createApp, h, ref } from 'vue';
import YugiohCard from '/src/components/YugiohCard.vue';
import 'normalize.css';

// 测试真实组件，延迟清单以便在 ready 等待期间切换卡片或卸载。
await fetch('/ready-test/reset?fixture=export', { method: 'POST' });
const app = createApp(YugiohCard, { resourcePath: '/export-resources' });
app.mount('#app');
const report = document.querySelector('#report');
const released = ref(false);
const unmounted = ref(false);
const errors = ref(0);
const seen = new WeakSet();
new MutationObserver(() => {
  for (const message of document.querySelectorAll('.editor-status[role=alert]')) {
    if (seen.has(message)) continue;
    seen.add(message);
    errors.value++;
  }
}).observe(document.body, { childList: true, subtree: true });
const release = async () => {
  if (released.value) return;
  released.value = true;
  await fetch('/ready-test/release/manifest?fixture=export', { method: 'POST' });
  document.body.dataset.testState = 'released';
  report.textContent = '字体清单已释放';
};
const unmount = () => {
  if (unmounted.value) return;
  unmounted.value = true;
  app.unmount();
  report.textContent = '组件已卸载，旧导出等待已取消';
};

createApp({
  render: () => [
    h(ElButton, {
      id: 'release',
      type: 'primary',
      disabled: released.value,
      onClick: release,
    }, () => '释放字体清单'),
    h(ElButton, {
      id: 'unmount',
      disabled: unmounted.value,
      onClick: unmount,
    }, () => '卸载组件'),
    h('span', { class: 'test-note' }, ['累计错误提示 ', h('b', { id: 'errors' }, String(errors.value))]),
  ],
}).mount('#export-actions');
document.body.dataset.testState = 'waiting';
report.textContent = '组件已挂载，字体清单等待中';
</script>
  </body>
</html>
